# ============================================================================
# Smart Municipal Council — Backend Configuration
# ============================================================================
# Copy this file to application.properties and fill in your values.
# NEVER commit application.properties with real credentials to version control.
# ============================================================================

spring.application.name=smart-municipal-council
server.port=8081

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_municipal_council?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:0987654321}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# --- SQL Initialization (run schema.sql + seed.sql on startup) ---
spring.sql.init.mode=never
# Set to 'always' only on first run to populate the database.
# Change back to 'never' after the database is initialized to avoid duplicate data.
# spring.sql.init.schema-locations=classpath:db/schema.sql
# spring.sql.init.data-locations=classpath:db/seed.sql

# --- File Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- JWT ---
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=604800000

# --- Error Messages ---
server.error.include-message=always
server.error.include-binding-errors=always

# --- Logging ---
logging.level.org.springframework.security=WARN
logging.level.com.smc=INFO

# --- PayHere Payment Gateway (Sri Lanka) ---
# PayHere Merchant ID and Secret (Defaults configured for PayHere Sandbox testing)
payhere.merchant-id=${PAYHERE_MERCHANT_ID:1229999}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:4XXXXXXXXXX}
payhere.sandbox=${PAYHERE_SANDBOX:true}
payhere.checkout-url=${PAYHERE_CHECKOUT_URL:https://sandbox.payhere.lk/pay/checkout}
payhere.notify-url=${PAYHERE_NOTIFY_URL:http://localhost:8080/api/payments/payhere/notify}
payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:5173}
payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:5173}

